name: CI

on:
  push:
    branches: [ fix/test-suite-refactor, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"] # Cookiecutter-django es estricto con versiones estables

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Instalamos las herramientas que 'sh' intentaba buscar
          pip install ruff djlint django-upgrade cookiecutter pytest-cookies binaryornot PyYAML
          # Instalamos requerimientos del proyecto si existen
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest
        run: |
          # Ejecutamos solo los tests de generación para validar tu refactor
          pytest tests/test_cookiecutter_generation.py -v

